  <rect width="1200" height="630" fill="url(#bg)"/><rect width="1200" height="630" fill="url(#n)"/>
  <circle cx="1040" cy="90" r="250" fill="none" stroke="#9f2f25" opacity=".12" stroke-width="2"/>
