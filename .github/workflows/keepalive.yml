name: Keep Render Gateway Warm

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping gateway health
        run: curl -fsS --retry 8 --retry-delay 10 --retry-all-errors --max-time 120 https://luyun-xinsheng-gateway.onrender.com/healthz
      - name: Ping API health
        run: curl -fsS --retry 4 --retry-delay 10 --retry-all-errors --max-time 60 https://luyun-xinsheng-gateway.onrender.com/api/health