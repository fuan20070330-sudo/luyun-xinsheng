services:
  - type: web
    name: luyun-xinsheng-gateway
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: PORT
        value: 8080
      - key: ALLOWED_ORIGIN
        value: https://fuan20070330-sudo.github.io
      - key: DATABASE_URL
        fromDatabase:
          name: luyun-xinsheng-db
          property: connectionString
      - key: DATABASE_SSL
        value: "true"
      - key: AUTH_COOKIE_ENABLED
        value: "true"
      - key: AUTH_RETURN_TOKEN
        value: "false"
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAME_SITE
        value: None
      - key: DATA_FILE
        value: /data/luyun-store.json
      # 生产环境请为 /data 配置持久化磁盘；免费实例文件系统可能被重置。
      - key: OFFICIAL_VERIFICATION_URL
        sync: false
      - key: OFFICIAL_VERIFICATION_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-6
      - key: OPENAI_BASE_URL
        value: https://api.openai.com/v1
      - key: AI_API_MODE
        value: responses
      - key: AI_API_URL
        sync: false
      - key: AI_API_KEY
        sync: false
      - key: AI_MODEL
        sync: false

databases:
  - name: luyun-xinsheng-db
    plan: free
    databaseName: luyun
    user: luyun
