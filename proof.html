<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#9f2f25">
  <title>内容护照验证｜老字号叙事工坊</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/styles.css?v=3.8.1">
  <style>
    body{min-height:100vh;background:radial-gradient(circle at 80% 10%,rgba(159,47,37,.12),transparent 32%),var(--paper)}
    .proof-page{width:min(900px,calc(100% - 24px));margin:0 auto;padding:48px 0}
    .proof-card{padding:clamp(20px,4vw,38px);border:1px solid var(--line);border-radius:20px;background:rgba(255,253,247,.92);box-shadow:var(--shadow-md)}
    .proof-brand{display:flex;align-items:center;gap:12px;margin-bottom:28px}.proof-brand .brand-seal{width:46px;height:46px;display:grid;place-items:center;color:#fff;background:var(--cinnabar);border-radius:12px;font-size:22px}
    .proof-brand strong{font-family:var(--serif);font-size:20px}.proof-brand small{display:block;color:var(--ink-faint);font-size:11px}
    .proof-state{padding:16px;border-radius:12px;font-weight:700;margin-bottom:18px}.proof-state[data-valid="true"]{color:#185748;background:rgba(31,109,92,.1)}.proof-state[data-valid="false"]{color:#9f2f25;background:rgba(159,47,37,.09)}
    .proof-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.proof-grid div{padding:11px;border:1px solid var(--line);border-radius:10px}.proof-grid small{display:block;color:var(--ink-faint);font-size:10px}.proof-grid strong{display:block;margin-top:4px;word-break:break-all;font-size:12px}
    .proof-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}.proof-actions a{text-decoration:none}
    @media(max-width:640px){.proof-page{padding:24px 0}.proof-grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <main class="proof-page">
    <section class="proof-card">
      <a class="proof-brand" href="./"><span class="brand-seal">坊</span><span><strong>老字号叙事工坊</strong><small>内容护照公开验证</small></span></a>
      <div id="proof-state" class="proof-state" data-valid="false">正在验证…</div>
      <div id="proof-grid" class="proof-grid"></div>
      <div class="proof-actions"><a class="button button-primary" href="./">返回应用</a><a class="button button-ghost" id="proof-api-link" href="#" target="_blank" rel="noopener">查看验证接口</a></div>
    </section>
  </main>
  <script src="js/config.js?v=3.8.1"></script>
  <script>
    (function(){'use strict';var id=new URLSearchParams(location.search).get('id')||'';var state=document.getElementById('proof-state');var grid=document.getElementById('proof-grid');var api=window.LUYUN_CONFIG.apiBaseUrl;if(!id){state.textContent='缺少内容护照编号。';return;}var endpoint=api+'/api/passport/verify?id='+encodeURIComponent(id);document.getElementById('proof-api-link').href=endpoint;fetch(endpoint,{credentials:'include'}).then(function(r){return r.json().then(function(body){return {status:r.status,body:body}})}).then(function(result){var body=result.body||{};var p=body.passport||{};var valid=!!body.valid;state.dataset.valid=String(valid);state.textContent=valid?'数字签名有效，内容护照未被篡改。':'验证失败：'+(body.verification&&body.verification.reason||body.error&&body.error.message||'无法验证');var fields=[['护照编号',p.id],['品牌',p.brandName],['平台',p.platformName],['模型',p.model],['提示词版本',p.promptVersion],['证明编号',p.proofId],['证明状态',p.proofStatus],['证明分',p.proofScore],['事实引用',(p.facts||[]).join('、')],['内容哈希',p.contentHash],['数字签名',p.signature?'已签名':'未签名'],['签发时间',p.signedAt||p.createdAt],['审核次数',p.reviewCount||0],['状态',p.status]];grid.innerHTML=fields.map(function(x){return '<div><small>'+escapeHtml(x[0])+'</small><strong>'+escapeHtml(x[1]||'--')+'</strong></div>'}).join('')}).catch(function(){state.textContent='无法连接内容护照验证服务。'});function escapeHtml(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}})();
  </script>
</body>
</html>
